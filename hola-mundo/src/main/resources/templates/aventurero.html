<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aventurero - Spring Boot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #1a1a2e;
            color: #e0e0e0;
        }
        p { 
            font-size: 1.2em; 
            text-align: left;
        }
        .caja {
            display: inline-block;
            border: 2px dashed #4a90d9;
            border-radius: 12px;
            padding: 30px 60px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="caja">
        <p>Aventurero: <strong th:text="${aventurero.nombre}">Nombre</strong></p>
        <p>Clase: <strong th:text="${aventurero.clase}">Clase</strong></p>
        <p>Nivel: <strong th:text="${aventurero.nivel}">0</strong></p>
    </div>
</body>
</html>
